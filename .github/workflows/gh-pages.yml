name: Build and Deploy
on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build static files
        run: |
          mkdir -p dist/r
          cp -avr index.html CNAME background.jpg calendar.html dist/
          cp -avr js dist/js
          cp -avr tmpls dist/tmpls
          cp -avr r/*.html dist/r/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages          # Deploy edilecek branch
          folder: dist              # Deploy edilecek klasör
          token: ${{ secrets.ACCESS_TOKEN }}
